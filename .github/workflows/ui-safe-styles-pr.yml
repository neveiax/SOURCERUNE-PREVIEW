name: Public Original UI CSS Safety Review
on:
  pull_request:
    branches: [main]
    paths:
      - "Web/App/index.html"
      - "Web/App/app.js"
      - "Web/App/ui01_*"
      - "Web/App/ui02_*"
      - "Web/App/ui_ref_text_guard_*"
      - "Web/App/ui_asset_browser_frame_ref_v1.css"
      - "scripts/check_allowlist.py"
      - "public_ui_style_sync_manifest.json"
      - ".github/workflows/ui-safe-styles-pr.yml"
permissions:
  contents: read
jobs:
  public_ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify public UI allowlist and approved binary hashes
        run: |
          set -euo pipefail
          python3 scripts/check_allowlist.py
          python3 scripts/check_original_port.py
          python3 scripts/check_public_dsp_release.py
          node --check Web/App/app.js
      - name: One Chromium UI and existing public audio smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ui-safe-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/index.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-public-ui puppeteer-core@24
          NODE_PATH=/tmp/sr-public-ui/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const p=require("puppeteer-core"),fs=require("fs");
          const compiledAudio=fs.existsSync("Web/App/audio/public-dsp-manifest.json");
          (async()=>{
            const browser=await p.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              for(const [ui,w,h] of [["UI_01",1499,807],["UI_02",1672,941]]){
                const page=await browser.newPage();
                await page.setViewport({width:w,height:h,deviceScaleFactor:1});
                await page.goto("http://127.0.0.1:4173/Web/App/?ui="+ui,{waitUntil:"networkidle0",timeout:30000});
                // A paused app must not continuously paint canvases or the
                // whole SVG scene. These counters track the actual render path.
                const idleBefore=await page.evaluate(()=>({...window.__sourceruneRenderStats}));
                await new Promise(resolve=>setTimeout(resolve,260));
                const idleAfter=await page.evaluate(()=>({...window.__sourceruneRenderStats}));
                if(!idleBefore||idleAfter.activeFrames!==idleBefore.activeFrames||
                   idleAfter.animatedSceneUpdates!==idleBefore.animatedSceneUpdates||
                   idleAfter.idlePasses!==idleBefore.idlePasses)
                  throw Error(ui+" idle render still running "+JSON.stringify({idleBefore,idleAfter}));
                const background=await page.evaluate(()=>window.__sourceruneVisualAllocations?.gridBuilds);
                if(background!==1)throw Error(ui+" static spectrum background rebuilt unexpectedly "+background);
                // The visualization must still react to buttons while paused.
                await page.$eval('[data-spectrum-rta]',el=>el.click());
                const backgroundAfter=await page.evaluate(()=>window.__sourceruneVisualAllocations?.gridBuilds);
                if(backgroundAfter!==1)throw Error(ui+" spectrum grid was rebuilt on idle control changes");
                await page.$eval('[data-spectrum-rta]',el=>el.click());
                console.log("SPECTRUM_STATIC_GRID_PASS",ui);
                console.log("IDLE_RENDER_PASS",ui);
                // One real-pointer regression per UI, inside the existing Chromium job.
                const originalMotion=await page.$eval("#sourceNode",el=>Number(el.getAttribute("aria-valuenow")));
                const sourceRect=await page.$eval("#sourceNode",el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}});
                await page.mouse.move(sourceRect.x,sourceRect.y);
                await page.mouse.down();
                await page.mouse.move(sourceRect.x+45,sourceRect.y,{steps:3});
                await page.mouse.up();
                const draggedMotion=await page.$eval("#sourceNode",el=>Number(el.getAttribute("aria-valuenow")));
                if(Math.abs(draggedMotion-originalMotion)<1){
                  const probe=await page.evaluate(({x,y})=>{
                    const el=document.elementFromPoint(x,y),svg=document.querySelector("#sceneSvg"),node=document.querySelector("#sourceNode");
                    const r=node.getBoundingClientRect(),b=svg.getBoundingClientRect();
                    return {tag:el?.tagName,id:el?.id,near:el?.closest?.("#sourceNode,#motionPathHit")?.id,
                      point:{x,y},rect:{x:r.x,y:r.y,width:r.width,height:r.height},
                      svg:{x:b.x,y:b.y,width:b.width,height:b.height,viewBox:svg.getAttribute("viewBox")},
                      motion:node.getAttribute("aria-valuenow"),top:document.elementFromPoint(x,y)?.outerHTML?.slice(0,160)};
                  },sourceRect);
                  throw Error(ui+" SOURCE drag did not update Motion "+JSON.stringify(probe));
                }
                await page.$eval("#undoBtn",el=>el.click());
                if(Math.abs(await page.$eval("#sourceNode",el=>Number(el.getAttribute("aria-valuenow")))-originalMotion)>.1)
                  throw Error(ui+" SOURCE drag Undo failed");
                // Real pointer acceptance: LISTENER can be grabbed via its
                // dedicated label even when SOURCE and LISTENER overlap.
                const listenerBefore=await page.$eval("#listenerNode",el=>el.getAttribute("transform"));
                const labelPoint=await page.$eval("#listenerLabel",el=>{
                  const r=el.getBoundingClientRect();
                  return {x:r.left+r.width/2,y:r.top+r.height/2};
                });
                await page.mouse.move(labelPoint.x,labelPoint.y);
                await page.mouse.down();
                await page.mouse.move(labelPoint.x+45,labelPoint.y,{steps:4});
                await page.mouse.up();
                const listenerMoved=await page.$eval("#listenerNode",el=>el.getAttribute("transform"));
                if(listenerMoved===listenerBefore)
                  throw Error(ui+" LISTENER label drag did not move receiver");
                await page.$eval("#undoBtn",el=>el.click());
                const listenerRestored=await page.$eval("#listenerNode",el=>el.getAttribute("transform"));
                if(listenerRestored!==listenerBefore)
                  throw Error(ui+" LISTENER drag Undo failed "+JSON.stringify({listenerBefore,listenerMoved,listenerRestored}));
                console.log("LISTENER_REAL_POINTER_PASS",ui);
                                if(ui==="UI_02"){
                  const beforeDistance=await page.$eval("#currentDistanceControl",el=>Number(el.getAttribute("aria-valuenow")));
                  const dialBefore=await page.$eval("#currentDistanceControl",el=>({
                    angle:Number.parseFloat(el.style.getPropertyValue("--distance-angle")),
                    visual:getComputedStyle(el,"::before").transform
                  }));
                  if(!Number.isFinite(dialBefore.angle)||dialBefore.visual==="none")throw Error("UI_02 large dial initial needle not bound");
                  for(const id of ["speed","doppler","width"]){
                    const valid=await page.$eval('[data-motion-adjust="'+id+'"]',el=>{
                      const parent=el.closest(".motion-readouts>div");
                      return !!parent&&Number.isFinite(Number.parseFloat(parent.style.getPropertyValue("--angle")));
                    });
                    if(!valid)throw Error("UI_02 "+id+" needle not bound");
                  }
                  const r=await page.$eval("#currentDistanceControl",el=>{const b=el.getBoundingClientRect();return {x:b.left+b.width/2,y:b.top+b.height/2}});
                  await page.mouse.move(r.x,r.y);
                  await page.mouse.down();
                  await page.mouse.move(r.x,r.y-30,{steps:3});
                  await page.mouse.up();
                  const now=await page.$eval("#currentDistanceControl",el=>Number(el.getAttribute("aria-valuenow")));
                  if(now<=beforeDistance+1)throw Error(ui+" distance dial drag did not update value");
                  const dialAfter=await page.$eval("#currentDistanceControl",el=>({
                    angle:Number.parseFloat(el.style.getPropertyValue("--distance-angle")),
                    visual:getComputedStyle(el,"::before").transform
                  }));
                  if(!Number.isFinite(dialAfter.angle)||Math.abs(dialAfter.angle-dialBefore.angle)<2||
                     dialAfter.visual===dialBefore.visual)throw Error("UI_02 large needle did not ROTATE after distance changed "+JSON.stringify({dialBefore,dialAfter}));
                  await page.$eval("#undoBtn",el=>el.click());
                  const restored=await page.$eval("#currentDistanceControl",el=>Number(el.getAttribute("aria-valuenow")));
                  if(Math.abs(restored-beforeDistance)>.11)throw Error(ui+" distance dial Undo failed");
                  const dialUndo=await page.$eval("#currentDistanceControl",el=>Number.parseFloat(el.style.getPropertyValue("--distance-angle")));
                  if(Math.abs(dialUndo-dialBefore.angle)>.6)throw Error("UI_02 dial needle did not follow Undo");
                }
                if(ui==="UI_02"){
                  const firstMode=await page.$eval("#motionDeckMode",el=>el.value);
                  for(const mode of ["STATIC","APPROACH","PASS_BY","LEAVE","MANUAL"]){
                    await page.select("#motionDeckMode",mode);
                    const deviation=await page.$eval(".motion-deck-graph",svg=>{
                      const path=svg.querySelector("#motionDeckPath"),dot=svg.querySelector("#motionDeckCurrent");
                      const x=Number(dot.getAttribute("cx")),y=Number(dot.getAttribute("cy"));
                      let low=0,high=path.getTotalLength();
                      for(let i=0;i<16;i++){
                        const m=(low+high)/2;
                        if(path.getPointAtLength(m).x<x)low=m;else high=m;
                      }
                      const point=path.getPointAtLength((low+high)/2);
                      return Math.hypot(point.x-x,point.y-y);
                    });
                    if(deviation>.35)throw Error(ui+" off-path Motion indicator "+mode+" "+deviation);
                  }
                  await page.select("#motionDeckMode",firstMode);
                  const values=await page.$eval("#ui02TransmissionSelect",el=>({count:el.options.length,first:el.value,next:el.options[(el.selectedIndex+1)%el.options.length].value}));
                  if(values.count!==24)throw Error(ui+" catalog selector count mismatch");
                  if(!(await page.$eval("#ui02SignalStatus",el=>el.textContent==="IDLE")))throw Error(ui+" waveform must be idle without playing");
                  if(!(await page.$eval("#ui02BadSignalWaveform",el=>el.width===160&&el.height===48&&el.getBoundingClientRect().width>30)))throw Error(ui+" waveform canvas missing");
                  await page.select("#ui02TransmissionSelect",values.next);
                  await page.$eval("#undoBtn",button=>button.click());
                  if(!(await page.$eval("#ui02TransmissionSelect",(el,value)=>el.value===value,values.first)))throw Error(ui+" selector undo failed");
                }else if(await page.$("#ui02TransmissionSelect"))throw Error("UI02-only control leaked into UI01");
                if(ui==="UI_02"){
                  const fit=await page.evaluate(()=>{const panel=document.querySelector(".macro-intelligibility"),r=panel.getBoundingClientRect(),buttons=[...panel.querySelectorAll('[data-macro-select="intelligibilityMode"]')];return{count:buttons.length,visible:buttons.every(el=>{const b=el.getBoundingClientRect();return b.left>=r.left-1&&b.right<=r.right+1&&b.top>=r.top-1&&b.bottom<=r.bottom+1;})}});
                  if(fit.count!==3||!fit.visible)throw Error(ui+" mode buttons clipped "+JSON.stringify(fit));
                  await page.$eval('.macro-intelligibility [data-value="DIALOGUE"]',el=>el.click());
                  if(!(await page.$eval('.macro-intelligibility [data-value="DIALOGUE"]',el=>el===document.activeElement&&el.getAttribute("aria-pressed")==="true")))throw Error(ui+" mode focus");
                  await page.keyboard.press("ArrowDown");
                  if(!(await page.$eval('.macro-intelligibility [data-value="AGGRESSIVE"]',el=>el===document.activeElement&&el.getAttribute("aria-pressed")==="true")))throw Error(ui+" mode arrow");
                  await page.$eval("#undoBtn",el=>el.click());
                  if(!(await page.$eval('.macro-intelligibility [data-value="DIALOGUE"]',el=>el.getAttribute("aria-pressed")==="true")))throw Error(ui+" mode undo");
                }
                const ok=await page.evaluate(()=>{
                  const styles=[...document.querySelectorAll('link[rel="stylesheet"]')].filter(x=>/ui01_ref_batch_|ui02_ref_batch_|ui_ref_text_guard_/.test(x.href));
                  const live=!!document.querySelector(".macro-rail, #macroStrip, .macro-motion");
                  return {css:styles.length,live,missing:styles.filter(x=>!x.sheet).map(x=>x.href)};
                });
                if(ok.css!==9||!ok.live||ok.missing.length)throw Error("Original public UI cosmetic styles not loaded "+JSON.stringify({ui,ok}));
                const clarity=await page.evaluate(()=>{
                  const app=document.querySelector('.app'),style=getComputedStyle(app);
                  return {geometry:window.__geometryAudit?.ok,zoom:Number(style.zoom),transform:style.transform,willChange:style.willChange};
                });
                if(!clarity.geometry||!(clarity.zoom>0&&clarity.zoom<1)||clarity.transform!=="none"||clarity.willChange!=="auto")
                  throw Error("Original UI render clarity or geometry failed "+JSON.stringify({ui,clarity}));
                await page.screenshot({path:"public_"+ui+".png",fullPage:false});
                const modalStyle=await page.evaluate(()=>{
                  const link=document.querySelector('link[href="./ui_asset_browser_frame_ref_v1.css"]');
                  return {sheetLoaded:!!link?.sheet,source:link?.getAttribute("href")};
                });
                if(!modalStyle.sheetLoaded)throw Error("Allowlisted modal CSS did not load "+JSON.stringify(modalStyle));
                await page.focus('.module-card[data-type="WALL_COVER"]');
                if(!(await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el===document.activeElement&&el.tabIndex===0)))throw Error(ui+" module card focus missing");
                await page.keyboard.press("Enter");
                if(!(await page.$eval("#assetBrowser",el=>!el.classList.contains("hidden"))))throw Error(ui+" Enter failed");
                await page.keyboard.press("Escape");
                if(!(await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el===document.activeElement)))throw Error(ui+" return focus failed");
                await page.keyboard.press("Space");
                if(!(await page.$eval("#assetBrowser",el=>!el.classList.contains("hidden"))))throw Error(ui+" Space failed");
                await page.keyboard.press("Escape");
                await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el.click());
                await page.waitForSelector('#assetBrowser:not(.hidden) .preview-art img',{timeout:12000});
                // Hover is allowed to preview an unselected asset; explicitly
                // focus the selected row before checking its selected-frame art.
                await page.hover('#assetList .asset-item.active');
                await page.waitForSelector('.asset-preview.selected .preview-art',{timeout:5000});
                const frame=await page.evaluate(()=>{
                  const s=q=>getComputedStyle(document.querySelector(q));
                  return {title:document.querySelector("#browserTitle")?.textContent,
                    border:s(".browser-card").borderTopWidth,
                    oldFrame:s(".browser-card").backgroundImage,
                    imageFrame:s(".asset-preview.selected .preview-art").backgroundImage,
                    imageBorder:s(".asset-preview.selected .preview-art").borderTopWidth,
                    split:s(".asset-preview").borderLeftWidth,
                    frameZ:Number(s(".asset-browser").zIndex),
                    transportZ:Number(s("#webAudioTransport").zIndex),
                    lowerEdgeVisible:(()=>{const r=document.querySelector(".browser-card").getBoundingClientRect();const el=document.elementFromPoint(Math.round(r.left+r.width/2),Math.round(r.bottom-2));return !!el?.closest(".browser-card");})(),
                    items:document.querySelectorAll(".asset-item").length};
                });
                if(frame.title!=="WALL / COVER"||frame.border!=="1px"||
                   frame.oldFrame!=="none"||frame.imageFrame!=="none"||
                   frame.imageBorder!=="1px"||frame.split!=="1px"||frame.items<10||!(frame.frameZ>frame.transportZ)||!frame.lowerEdgeVisible)
                  throw Error("Public original modal still uses ugly stretched frame: "+JSON.stringify(frame));
                await page.screenshot({path:"public_MODAL_"+ui+".png",fullPage:false});
                if(!(await page.$eval("#assetResultCount",e=>e.textContent.includes(" ASSETS"))))throw Error(ui+" asset count missing");
                await page.$eval("#assetSearch",e=>{e.value="__no_match__";e.dispatchEvent(new Event("input",{bubbles:true}))});
                await page.click(".asset-empty-reset");
                if(!(await page.$eval("#assetClearFilters",e=>e.disabled)))throw Error(ui+" reset not cleared");
                await page.focus(".asset-item:nth-child(2)");
                await page.keyboard.press("End");
                if(!(await page.$eval(".asset-item:last-of-type",e=>e===document.activeElement)))throw Error(ui+" End failed");
                await page.keyboard.press("Home");
                if(!(await page.$eval(".asset-item:first-of-type",e=>e===document.activeElement)))throw Error(ui+" Home failed");
                await page.focus("#assetSearch");
                if(!(await page.$eval("#assetSearch",el=>el===document.activeElement)))throw Error(ui+" search focus absent");
                await page.$eval("#assetSearch",el=>{el.value="__unmatched_asset_20261012__";el.dispatchEvent(new Event("input",{bubbles:true}))});
                if(!(await page.$eval(".asset-empty",el=>el.textContent.includes("No assets found"))))throw Error(ui+" missing empty state");
                await page.$eval("#assetSearch",el=>{el.value="";el.dispatchEvent(new Event("input",{bubbles:true}))});
                await page.click(".asset-item:nth-child(3)");
                if(!(await page.$eval(".asset-item.active",el=>el===document.activeElement)))throw Error(ui+" selected focus lost");
                await page.$eval(".preview-art img",el=>el.dispatchEvent(new Event("error")));
                if(!(await page.$eval(".preview-fallback",el=>el.textContent==="Preview unavailable")))throw Error(ui+" image fallback absent");
                await page.keyboard.press("Escape");
                if(!(await page.evaluate(()=>document.querySelector("#assetBrowser").classList.contains("hidden") && document.activeElement===document.querySelector('.module-card[data-type="WALL_COVER"]'))))throw Error(ui+" Escape focus return missing");
                await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el.click());
                await page.click("#browserClose");
                if(!(await page.$eval("#assetBrowser",x=>x.classList.contains("hidden"))))
                  throw Error("Original modal close lost");

                // A single short functional browser check, within the existing UI smoke:
                // Keep the legacy EQ fixture only when no approved compiled release exists.
                if(ui==="UI_01"&&!compiledAudio){
                  const testData=await page.evaluate(()=>{
                    const sr=48000,n=sr*2,buf=new ArrayBuffer(44+n*2),d=new DataView(buf);
                    const ascii=(at,t)=>{for(let i=0;i<t.length;i++)d.setUint8(at+i,t.charCodeAt(i))};
                    ascii(0,"RIFF");d.setUint32(4,36+n*2,true);ascii(8,"WAVE");ascii(12,"fmt ");
                    d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
                    d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);
                    d.setUint16(32,2,true);d.setUint16(34,16,true);
                    ascii(36,"data");d.setUint32(40,n*2,true);
                    for(let i=0;i<n;i++)d.setInt16(44+i*2,Math.round(0.1*32767*Math.sin(2*Math.PI*600*i/sr)),true);
                    const el=document.querySelector("#audioFile"),dt=new DataTransfer();
                    dt.items.add(new File([buf],"browser-smoke.wav",{type:"audio/wav"}));
                    el.files=dt.files;el.dispatchEvent(new Event("change",{bubbles:true}));
                    return true;
                  });
                  if(!testData)throw Error("No browser audio input");
                  await page.waitForFunction(()=>document.querySelector("#stateStatus")?.textContent.includes("AUDIO LOADED"),{timeout:15000});
                  await page.$eval('[data-open="EQ_TONE"]',el=>el.click());
                  const adjusted=await page.evaluate(()=>{
                    const el=document.querySelector('[data-param="b2Gain"]');
                    if(!el)return false;
                    el.value="12";el.dispatchEvent(new Event("input",{bubbles:true}));
                    return true;
                  });
                  if(!adjusted)throw Error("Three-band EQ knob has no input binding");
                  await page.$eval("#playBtn",el=>el.click());
                  await page.waitForFunction(()=>document.querySelector("#blockReadout")?.textContent.includes("EQ / LIVE"),{timeout:15000});
                  await page.waitForFunction(()=>Number(document.querySelector("#audioElement")?.currentTime)>0.25,{timeout:15000});
                  await page.waitForFunction(()=>{
                    const a=Number(document.querySelector("#peakInValue")?.textContent);
                    const b=Number(document.querySelector("#peakOutValue")?.textContent);
                    return Number.isFinite(a)&&Number.isFinite(b)&&b-a>3;
                  },{timeout:15000});
                  // During continuous playback, analyser buffers and
                  // spectrum trace scratch should be allocated once, not once
                  // per frame. Assert this inside the existing audio smoke.
                  const allocationsBefore=await page.evaluate(()=>({
                    ...window.__sourceruneVisualAllocations,
                    frames:window.__sourceruneRenderStats.activeFrames
                  }));
                  await new Promise(resolve=>setTimeout(resolve,180));
                  const allocationsAfter=await page.evaluate(()=>({
                    ...window.__sourceruneVisualAllocations,
                    frames:window.__sourceruneRenderStats.activeFrames
                  }));
                  if(allocationsBefore.timeDomain<2||allocationsBefore.traceScratch<1||
                     allocationsAfter.frames<=allocationsBefore.frames||
                     allocationsAfter.timeDomain!==allocationsBefore.timeDomain||
                     allocationsAfter.traceScratch!==allocationsBefore.traceScratch)
                    throw Error("Audio visualization allocates per frame or is stalled "+
                      JSON.stringify({allocationsBefore,allocationsAfter}));
                  console.log("VISUAL_BUFFER_REUSE_PASS",ui);
                  await page.$eval("#globalBypass",el=>el.click());
                  await page.waitForFunction(()=>document.querySelector("#blockReadout")?.textContent.includes("BYPASS"),{timeout:12000});
                  console.log("PUBLIC EQ AUDIO PASS: WAV/PLAY/600Hz boost >3dB/real meter/BYPASS");
                }

                // Real playback performance acceptance is independent of
                // which approved public DSP backend is installed.
                const fixture=await page.evaluate(()=>{
                  const sr=48000,n=sr*3,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
                  const str=(offset,t)=>{for(let i=0;i<t.length;i++)dv.setUint8(offset+i,t.charCodeAt(i));};
                  str(0,"RIFF");dv.setUint32(4,36+n*2,true);str(8,"WAVE");
                  str(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);
                  dv.setUint16(22,1,true);dv.setUint32(24,sr,true);
                  dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);
                  dv.setUint16(34,16,true);str(36,"data");dv.setUint32(40,n*2,true);
                  for(let i=0;i<n;i++)dv.setInt16(44+i*2,
                    Math.round(9000*Math.sin(2*Math.PI*330*i/sr)),true);
                  const input=document.querySelector("#audioFile"),dt=new DataTransfer();
                  dt.items.add(new File([buf],"visual-performance.wav",{type:"audio/wav"}));
                  input.files=dt.files;input.dispatchEvent(new Event("change",{bubbles:true}));
                  return true;
                });
                if(!fixture)throw Error(ui+" playback performance fixture missing");
                await page.waitForFunction(()=>document.querySelector("#stateStatus")?.textContent.includes("AUDIO LOADED"),{timeout:20000});
                await page.click("#playBtn");
                try{
                  await page.waitForFunction(()=>document.querySelector("#audioElement")?.currentTime>.20,{timeout:20000});
                }catch(error){
                  const diagnostic=await page.evaluate(()=>{
                    const a=document.querySelector("#audioElement"),b=document.querySelector("#playBtn");
                    return {status:document.querySelector("#stateStatus")?.textContent,
                      playButton:b?.textContent,src:!!a?.src,currentTime:a?.currentTime,
                      duration:a?.duration,paused:a?.paused,readyState:a?.readyState,
                      networkState:a?.networkState,error:a?.error?.message,
                      frames:window.__sourceruneRenderStats?.activeFrames};
                  });
                  throw Error(ui+" audio playback did not start "+JSON.stringify(diagnostic)+" / "+error.message);
                }
                await page.waitForFunction(()=>window.__sourceruneRenderStats?.activeFrames>=4,{timeout:10000});
                // Give the visual scheduler time to warm up before sampling.
                await new Promise(resolve=>setTimeout(resolve,120));
                const perfStart=await page.evaluate(()=>({
                  allocations:{...window.__sourceruneVisualAllocations},
                  frames:window.__sourceruneRenderStats.activeFrames,
                  time:performance.now()
                }));
                await new Promise(resolve=>setTimeout(resolve,420));
                const perfEnd=await page.evaluate(()=>({
                  allocations:{...window.__sourceruneVisualAllocations},
                  frames:window.__sourceruneRenderStats.activeFrames,
                  time:performance.now()
                }));
                const count=perfEnd.frames-perfStart.frames,
                      measuredRate=1000*count/(perfEnd.time-perfStart.time);
                if(count<4||measuredRate>36||
                   perfStart.allocations.timeDomain<2||
                   perfStart.allocations.traceScratch<1||
                   perfStart.allocations.gridBuilds!==1||
                   JSON.stringify(perfStart.allocations)!==JSON.stringify(perfEnd.allocations))
                  throw Error(ui+" active audio visual performance regression "+
                    JSON.stringify({perfStart,perfEnd,count,measuredRate}));
                await page.click("#playBtn");
                await page.waitForFunction(()=>document.querySelector("#audioElement")?.paused,{timeout:5000});
                const stopped=await page.evaluate(()=>window.__sourceruneRenderStats.activeFrames);
                await new Promise(resolve=>setTimeout(resolve,160));
                if(await page.evaluate(()=>window.__sourceruneRenderStats.activeFrames)!==stopped)
                  throw Error(ui+" frame loop continued after pause");
                console.log("ACTIVE_VISUAL_PERF_PASS",ui,Math.round(measuredRate)+"fps");
                // Main user workflows, in this same existing Chromium invocation.
                await page.setViewport({width:w,height:h,deviceScaleFactor:1});
                await page.click('#workbenchOpen');
                await page.waitForSelector('#workbenchDialog[open]');
                const toolLayout=await page.$eval('#workbenchDialog',e=>{const r=e.getBoundingClientRect();return r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight;});
                if(!toolLayout)throw Error(ui+' tools dialog clips');
                if(await page.$$eval('[data-workbench-module]',e=>e.length)<8)throw Error(ui+' detailed controls missing');
                await page.screenshot({path:'workbench_'+ui+'.png',fullPage:false});
                await page.keyboard.press('Escape');
                if(!(await page.$eval('#workbenchOpen',e=>document.activeElement===e)))throw Error(ui+' tools focus return failed');
                await page.click('#workbenchOpen');
                await page.click('[data-workbench-module="MOTION"]');
                if(!(await page.$eval('body',e=>e.classList.contains('advanced-open'))))throw Error(ui+' Motion editor missing');
                await page.click('#advancedCloseBtn');
                await page.click('#workbenchOpen');
                await page.click('[data-global-action="save"]');
                await page.type('#presetNameInput','Workflow <scene> & '+ui);
                await page.screenshot({path:'preset_'+ui+'.png',fullPage:false});
                await page.click('#presetNameForm button[type="submit"]');
                await page.waitForFunction(()=>document.querySelector('#stateStatus').textContent==='PRESET SAVED');
                const saved=await page.$eval('#presetSelect',e=>e.selectedOptions[0]?.textContent);
                if(saved!=='Workflow <scene> & '+ui)throw Error(ui+' preset name corrupted');
                await page.click('#workbenchOpen');
                await page.click('[data-global-action="save"]');
                await page.type('#presetNameInput','cancelled');
                await page.keyboard.press('Escape');
                if((await page.$eval('#presetSelect',e=>e.selectedOptions[0]?.textContent))!==saved)throw Error(ui+' cancel changed preset');
                await page.click('#globalBypass');
                await page.focus('#workbenchOpen');
                await page.keyboard.down('Control');await page.keyboard.press('z');await page.keyboard.up('Control');
                if(await page.$eval('#globalBypass',e=>e.classList.contains('active')))throw Error(ui+' shortcut Undo failed');
                const timeline=await page.$eval('.audition-timeline',e=>{const r=e.getBoundingClientRect();return r.height>0&&r.bottom<=innerHeight;});
                if(!timeline)throw Error(ui+' timeline missing');
                await page.setViewport({width:375,height:667,deviceScaleFactor:1});
                await page.click('#workbenchOpen');
                const compact=await page.$eval('#workbenchDialog',e=>{const r=e.getBoundingClientRect();return r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight&&e.scrollWidth<=e.clientWidth+1;});
                if(!compact)throw Error(ui+' compact tools overflow');
                await page.keyboard.press('Escape');
                console.log('MAIN_WORKFLOWS_PASS',ui);
                await page.close();
              }
              console.log("PUBLIC_UI_PREVIEW_PASS two views, original geometry, zoom clarity and asset-library interactions");
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
          if test -f Web/App/audio/public-dsp-manifest.json; then
            NODE_PATH=/tmp/sr-public-ui/node_modules CHROME_PATH="$chrome" node scripts/public-audio-browser-smoke.cjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-ui-pr116-safe-cosmetics
          path: |
            public_UI_01.png
            public_UI_02.png
            public_MODAL_UI_01.png
            public_MODAL_UI_02.png
            workbench_*.png
            preset_*.png
          retention-days: 7
