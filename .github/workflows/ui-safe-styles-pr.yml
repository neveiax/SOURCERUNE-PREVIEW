name: Public Original UI CSS Safety Review
on:
  pull_request:
    branches: [main]
    paths:
      - "Web/App/index.html"
      - "Web/App/app.js"
      - "Web/App/ui01_*"
      - "Web/App/ui02_*"
      - "Web/App/ui_ref_text_guard_*"
      - "Web/App/ui_asset_browser_frame_ref_v1.css"
      - "scripts/check_allowlist.py"
      - "public_ui_style_sync_manifest.json"
      - ".github/workflows/ui-safe-styles-pr.yml"
permissions:
  contents: read
jobs:
  public_ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing public asset allowlist and DSP exclusion
        run: |
          set -euo pipefail
          python3 scripts/check_allowlist.py
          python3 scripts/check_original_port.py
          ! find Web/App -type f \( -name '*.wasm' -o -name 'processor.js' \) | grep .
          node --check Web/App/app.js
      - name: One real no-audio Chromium UI screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ui-safe-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Web/App/index.html >/dev/null; then break; fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --silent --no-save --prefix /tmp/sr-public-ui puppeteer-core@24
          NODE_PATH=/tmp/sr-public-ui/node_modules CHROME_PATH="$chrome" node <<'NODE'
          const p=require("puppeteer-core");
          (async()=>{
            const browser=await p.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              for(const [ui,w,h] of [["UI_01",1499,807],["UI_02",1672,941]]){
                const page=await browser.newPage();
                await page.setViewport({width:w,height:h,deviceScaleFactor:1});
                await page.goto("http://127.0.0.1:4173/Web/App/?ui="+ui,{waitUntil:"networkidle0",timeout:30000});
                const ok=await page.evaluate(()=>{
                  const styles=[...document.querySelectorAll('link[rel="stylesheet"]')].filter(x=>/ui01_ref_batch_|ui02_ref_batch_|ui_ref_text_guard_/.test(x.href));
                  const live=!!document.querySelector(".macro-rail, #macroStrip, .macro-motion");
                  return {css:styles.length,live,missing:styles.filter(x=>!x.sheet).map(x=>x.href)};
                });
                if(ok.css!==9||!ok.live||ok.missing.length)throw Error("Original public UI cosmetic styles not loaded "+JSON.stringify({ui,ok}));
                await page.screenshot({path:"public_"+ui+".png",fullPage:false});
                const modalStyle=await page.evaluate(()=>{
                  const link=document.querySelector('link[href="./ui_asset_browser_frame_ref_v1.css"]');
                  return {sheetLoaded:!!link?.sheet,source:link?.getAttribute("href")};
                });
                if(!modalStyle.sheetLoaded)throw Error("Allowlisted modal CSS did not load "+JSON.stringify(modalStyle));
                await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el.click());
                await page.waitForSelector('#assetBrowser:not(.hidden) .preview-art img',{timeout:12000});
                const frame=await page.evaluate(()=>{
                  const s=q=>getComputedStyle(document.querySelector(q));
                  return {title:document.querySelector("#browserTitle")?.textContent,
                    border:s(".browser-card").borderTopWidth,
                    oldFrame:s(".browser-card").backgroundImage,
                    imageFrame:s(".asset-preview.selected .preview-art").backgroundImage,
                    imageBorder:s(".asset-preview.selected .preview-art").borderTopWidth,
                    split:s(".asset-preview").borderLeftWidth,
                    frameZ:Number(s(".asset-browser").zIndex),
                    transportZ:Number(s("#webAudioTransport").zIndex),
                    lowerEdgeVisible:(()=>{const r=document.querySelector(".browser-card").getBoundingClientRect();const el=document.elementFromPoint(Math.round(r.left+r.width/2),Math.round(r.bottom-2));return !!el?.closest(".browser-card");})(),
                    items:document.querySelectorAll(".asset-item").length};
                });
                if(frame.title!=="WALL / COVER"||frame.border!=="1px"||
                   frame.oldFrame!=="none"||frame.imageFrame!=="none"||
                   frame.imageBorder!=="1px"||frame.split!=="1px"||frame.items<10||!(frame.frameZ>frame.transportZ)||!frame.lowerEdgeVisible)
                  throw Error("Public original modal still uses ugly stretched frame: "+JSON.stringify(frame));
                await page.screenshot({path:"public_MODAL_"+ui+".png",fullPage:false});
                if(!(await page.$eval("#assetSearch",el=>el===document.activeElement)))throw Error(ui+" search focus absent");
                await page.$eval("#assetSearch",el=>{el.value="__unmatched_asset_20261012__";el.dispatchEvent(new Event("input",{bubbles:true}))});
                if(!(await page.$eval(".asset-empty",el=>el.textContent.includes("No assets found"))))throw Error(ui+" missing empty state");
                await page.$eval("#assetSearch",el=>{el.value="";el.dispatchEvent(new Event("input",{bubbles:true}))});
                await page.click(".asset-item:nth-child(3)");
                if(!(await page.$eval(".asset-item.active",el=>el===document.activeElement)))throw Error(ui+" selected focus lost");
                await page.$eval(".preview-art img",el=>el.dispatchEvent(new Event("error")));
                if(!(await page.$eval(".preview-fallback",el=>el.textContent==="Preview unavailable")))throw Error(ui+" image fallback absent");
                await page.keyboard.press("Escape");
                if(!(await page.evaluate(()=>document.querySelector("#assetBrowser").classList.contains("hidden") && document.activeElement===document.querySelector('.module-card[data-type="WALL_COVER"]'))))throw Error(ui+" Escape focus return missing");
                await page.$eval('.module-card[data-type="WALL_COVER"]',el=>el.click());
                await page.click("#browserClose");
                if(!(await page.$eval("#assetBrowser",x=>x.classList.contains("hidden"))))
                  throw Error("Original modal close lost");

                // A single short functional browser check, within the existing UI smoke:
                // public WebAudio EQ changes real WAV audio; no private DSP artifact.
                if(ui==="UI_01"){
                  const testData=await page.evaluate(()=>{
                    const sr=48000,n=sr*2,buf=new ArrayBuffer(44+n*2),d=new DataView(buf);
                    const ascii=(at,t)=>{for(let i=0;i<t.length;i++)d.setUint8(at+i,t.charCodeAt(i))};
                    ascii(0,"RIFF");d.setUint32(4,36+n*2,true);ascii(8,"WAVE");ascii(12,"fmt ");
                    d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
                    d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);
                    d.setUint16(32,2,true);d.setUint16(34,16,true);
                    ascii(36,"data");d.setUint32(40,n*2,true);
                    for(let i=0;i<n;i++)d.setInt16(44+i*2,Math.round(0.1*32767*Math.sin(2*Math.PI*600*i/sr)),true);
                    const el=document.querySelector("#audioFile"),dt=new DataTransfer();
                    dt.items.add(new File([buf],"browser-smoke.wav",{type:"audio/wav"}));
                    el.files=dt.files;el.dispatchEvent(new Event("change",{bubbles:true}));
                    return true;
                  });
                  if(!testData)throw Error("No browser audio input");
                  await page.waitForFunction(()=>document.querySelector("#stateStatus")?.textContent.includes("AUDIO LOADED"),{timeout:15000});
                  await page.$eval('[data-open="EQ_TONE"]',el=>el.click());
                  const adjusted=await page.evaluate(()=>{
                    const el=document.querySelector('[data-param="b2Gain"]');
                    if(!el)return false;
                    el.value="12";el.dispatchEvent(new Event("input",{bubbles:true}));
                    return true;
                  });
                  if(!adjusted)throw Error("Three-band EQ knob has no input binding");
                  await page.$eval("#playBtn",el=>el.click());
                  await page.waitForFunction(()=>document.querySelector("#blockReadout")?.textContent.includes("EQ / LIVE"),{timeout:15000});
                  await page.waitForFunction(()=>Number(document.querySelector("#audioElement")?.currentTime)>0.25,{timeout:15000});
                  await page.waitForFunction(()=>{
                    const a=Number(document.querySelector("#peakInValue")?.textContent);
                    const b=Number(document.querySelector("#peakOutValue")?.textContent);
                    return Number.isFinite(a)&&Number.isFinite(b)&&b-a>3;
                  },{timeout:15000});
                  await page.$eval("#globalBypass",el=>el.click());
                  await page.waitForFunction(()=>document.querySelector("#blockReadout")?.textContent.includes("BYPASS"),{timeout:12000});
                  console.log("PUBLIC EQ AUDIO PASS: WAV/PLAY/600Hz boost >3dB/real meter/BYPASS");
                }
                await page.close();
              }
              console.log("PUBLIC_UI_PREVIEW_PASS two views, 12 exact-source cosmetic CSS, no audio");
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: public-ui-pr116-safe-cosmetics
          path: |
            public_UI_01.png
            public_UI_02.png
            public_MODAL_UI_01.png
            public_MODAL_UI_02.png
          retention-days: 7
