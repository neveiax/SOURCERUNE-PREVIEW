name: Verify approved public audio for UI deployment
# Compiled binaries distributed to ALL anonymous browsers. They are reversible.
# Never include private C++/research or any secrets in public repository.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Web/App/app.js'
      - 'Web/App/audio/engine.js'
      - 'Web/App/audio/processor.js'
      - 'Web/App/audio/public-dsp-manifest.json'
      - 'Web/App/audio/*.wasm'
      - 'Web/App/audio/*.wasm.gz'
      - 'scripts/check_public_dsp_release.py'
      - 'scripts/check_allowlist.py'
      - 'scripts/check_original_port.py'
      - '.github/workflows/publish-public-dsp-wasm.yml'
  push:
    branches: [main]
    paths:
      - 'Web/App/app.js'
      - 'Web/App/audio/engine.js'
      - 'Web/App/audio/processor.js'
      - 'Web/App/audio/public-dsp-manifest.json'
      - 'Web/App/audio/*.wasm'
      - 'Web/App/audio/*.wasm.gz'
      - '.github/workflows/publish-public-dsp-wasm.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sr-reviewed-public-dsp-binaries
  cancel-in-progress: false
jobs:
  review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify original UI and reviewed public-only staging
        shell: bash
        run: |
          set -euo pipefail
          node --check Web/App/app.js
          node --check Web/App/audio/engine.js
          node --check Web/App/audio/processor.js
          python3 scripts/check_original_port.py
          python3 scripts/check_allowlist.py
          python3 scripts/check_public_dsp_release.py
  verify_existing:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout approved public main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify only the already approved public binary release
        shell: bash
        run: |
          set -euo pipefail
          test -f Web/App/audio/public-dsp-manifest.json
          python3 scripts/check_public_dsp_release.py
          python3 scripts/check_original_port.py
          python3 scripts/check_allowlist.py
          node --check Web/App/app.js
          node --check Web/App/audio/engine.js
          node --check Web/App/audio/processor.js
